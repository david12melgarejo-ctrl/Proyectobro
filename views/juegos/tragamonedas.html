<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlantic City - Tragamonedas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --bg:#0b0520;
      --card:#130826;
      --neon-purple:#8a2be2;
      --neon-pink:#ff2d95;
      --gold:#f6c85f;
      --accent:#00f0ff;
      --glass: rgba(255,255,255,0.04);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, "Helvetica Neue", Arial, sans-serif;background:linear-gradient(180deg,var(--bg), #07020b);color:#fff;-webkit-font-smoothing:antialiased;}
    .container{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;position:relative;}

    /* Botón Volver al Lobby */
    .btn-volver {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #e67e22;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 9999;
      transition: background 0.2s;
    }
    .btn-volver:hover { background: #d35400; }

    /* Marquesina */
    .marquee{width:100%;max-width:980px;position:relative;text-align:center;margin-bottom:8px}
    .title{
      display:inline-block;
      font-size:2.1rem;
      letter-spacing:4px;
      padding:12px 28px;
      border-radius:12px;
      background:linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      color:var(--gold);
      box-shadow: 0 6px 30px rgba(138,43,226,0.08), 0 0 18px rgba(138,43,226,0.08) inset;
      position:relative;
      z-index:2;
      text-shadow: 0 0 12px rgba(246,200,95,0.5);
      transform:translateY(6px);
    }

    /* Luces parpadeantes */
    .lights{position:absolute;left:50%;transform:translateX(-50%);top:100%;display:flex;gap:10px;width:80%;justify-content:center;z-index:1}
    .lights span{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--neon-pink);box-shadow:0 0 10px rgba(255,45,149,0.8);animation:blink 1.2s infinite ease-in-out}
    .lights span:nth-child(2){animation-delay:.15s;background:var(--neon-purple)}
    .lights span:nth-child(3){animation-delay:.3s;background:var(--accent)}
    .lights span:nth-child(4){animation-delay:.45s;background:var(--neon-purple)}
    .lights span:nth-child(5){animation-delay:.6s;background:var(--neon-pink)}
    @keyframes blink{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.3;transform:translateY(2px)}}

    /* Máquina */
    .slot-machine{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:980px}
    .screen{width:100%;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:14px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,0.6);position:relative;display:flex;justify-content:center;align-items:center}
    .reels{display:flex;gap:14px;align-items:center;justify-content:center;padding:10px 20px;width:100%;max-width:760px}
    .reel{width:32%;aspect-ratio:1/1.15;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;border:2px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(138,43,226,0.06), 0 0 18px rgba(0,240,255,0.02) inset}
    .reel::after{
      content:"";
      position:absolute;inset:0;border-radius:12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6) inset;
    }
    .symbol{
      font-size:3.6rem;
      filter:drop-shadow(0 8px 18px rgba(138,43,226,0.18));
      transition:transform .08s ease;
    }

    /* Línea central */
    .payline{
      position:absolute;left:6%;right:6%;height:4px;background:linear-gradient(90deg,transparent,#ffd77a,transparent);top:50%;transform:translateY(-50%);border-radius:4px;z-index:3;mix-blend-mode:screen;opacity:.9
    }

    /* Result & alert */
    .result-message, .alert-box{
      position:absolute;left:50%;transform:translateX(-50%);top:6%;padding:10px 18px;border-radius:10px;font-weight:600;display:none;z-index:10
    }
    .result-message.win{display:block;background:linear-gradient(90deg, rgba(246,200,95,0.12), rgba(255,255,255,0.02));color:var(--gold);box-shadow:0 8px 30px rgba(246,200,95,0.08)}
    .result-message.lose{display:block;background:linear-gradient(90deg, rgba(255,45,149,0.06), rgba(255,255,255,0.01));color:var(--neon-pink);box-shadow:0 8px 30px rgba(255,45,149,0.06)}
    .alert-box{top:auto;bottom:8%;transform:translateX(-50%);background:rgba(255,80,80,0.06);color:#ff9b9b;border:1px solid rgba(255,80,80,0.12);padding:12px 18px;display:none}

    /* Panel de controles */
    .controls{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:18px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01));margin-top:6px;flex-wrap:wrap}
    .stat,label{font-size:0.9rem;color:rgba(255,255,255,0.6)}
    .value{font-size:1.4rem;color:var(--gold);font-weight:700;margin-top:6px}
    .bet-controls{min-width:220px}
    .bet-row{display:flex;gap:10px;align-items:center;margin-top:8px}
    .btn{background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.06);padding:10px 14px;border-radius:10px;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.5)}
    .btn.small{padding:8px 12px;font-size:1.2rem}
    .btn.spin{flex:1;padding:14px 20px;font-size:1.3rem;border-radius:14px;background:linear-gradient(90deg,var(--neon-pink),var(--neon-purple));color:#fff;letter-spacing:1px;box-shadow: 0 10px 30px rgba(138,43,226,0.18), 0 0 30px rgba(255,45,149,0.10)}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .betValue{background:var(--glass);padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.03)}

    /* Responsive */
    @media (max-width:720px){
      .reels{gap:10px}
      .reel{width:30%}
      .title{font-size:1.6rem;padding:10px 18px}
      .controls{flex-direction:column;align-items:stretch}
      .btn.spin{width:100%}
    }
  </style>
</head>
<body>

  <!-- Botón Volver al Lobby -->
  <a href="../lobby-jugador.html" class="btn-volver">
      <i class="fa-solid fa-arrow-left"></i> Volver al Lobby
  </a>

  <div class="container">
    <!-- Marquesina / Letrero superior -->
    <header class="marquee">
      <h1 class="title">NEON SLOTS</h1>
      <div class="lights">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </header>

    <!-- Slot Machine -->
    <main class="slot-machine">
      <section class="screen">
        <!-- Reels -->
        <div class="reels" aria-hidden="false">
          <div class="reel" id="reel-0"><div class="symbol">🍒</div></div>
          <div class="reel" id="reel-1"><div class="symbol">🍋</div></div>
          <div class="reel" id="reel-2"><div class="symbol">💎</div></div>
        </div>

        <!-- Línea central (decorativa) -->
        <div class="payline"></div>

        <!-- Mensajes de resultado flotantes -->
        <div id="resultMessage" class="result-message" aria-live="polite"></div>
        <div id="alertBox" class="alert-box" role="alert" aria-live="assertive"></div>
      </section>

      <!-- Panel de controles -->
      <aside class="controls">
        <div class="stat">
          <label>Balance</label>
          <div id="balance" class="value">$1000</div>
        </div>

        <div class="bet-controls">
          <label>Apuesta</label>
          <div class="bet-row">
            <button id="betDown" class="btn small">−</button>
            <div id="betDisplay" class="value betValue">$10</div>
            <button id="betUp" class="btn small">+</button>
          </div>
          <div class="bet-range">Min $10 — Max $100</div>
        </div>

        <button id="spinBtn" class="btn spin">GIRAR</button>
      </aside>
    </main>
  </div>

  <script>
    const SYMBOLS = ['🍒','🍋','🍊','🔔','💎','7️⃣'];
    const START_BALANCE = 1000;
    const MIN_BET = 10;
    const MAX_BET = 100;
    const BET_STEP = 10;

    const balanceEl = document.getElementById('balance');
    const betDisplayEl = document.getElementById('betDisplay');
    const betUpBtn = document.getElementById('betUp');
    const betDownBtn = document.getElementById('betDown');
    const spinBtn = document.getElementById('spinBtn');
    const reelsEls = [
      document.querySelector('#reel-0 .symbol'),
      document.querySelector('#reel-1 .symbol'),
      document.querySelector('#reel-2 .symbol')
    ];
    const resultMessage = document.getElementById('resultMessage');
    const alertBox = document.getElementById('alertBox');

    let balance = START_BALANCE;
    let currentBet = MIN_BET;
    let spinning = false;

    function updateUI() {
      balanceEl.textContent = `$${balance}`;
      betDisplayEl.textContent = `$${currentBet}`;
    }
    updateUI();

    function showAlert(text, timeout = 2200) {
      alertBox.textContent = text;
      alertBox.style.display = 'block';
      alertBox.style.opacity = '1';
      clearTimeout(alertBox._hideTimer);
      alertBox._hideTimer = setTimeout(() => {
        alertBox.style.transition = 'opacity 400ms ease';
        alertBox.style.opacity = '0';
        setTimeout(()=> alertBox.style.display = 'none', 420);
      }, timeout);
    }

    function showResult(text, type='win', timeout = 2200) {
      resultMessage.textContent = text;
      resultMessage.className = 'result-message ' + (type === 'win' ? 'win' : 'lose');
      clearTimeout(resultMessage._hideTimer);
      resultMessage._hideTimer = setTimeout(() => {
        resultMessage.className = 'result-message';
        resultMessage.textContent = '';
      }, timeout);
    }

    betUpBtn.addEventListener('click', () => {
      if (spinning) return;
      currentBet = Math.min(MAX_BET, currentBet + BET_STEP);
      betDisplayEl.textContent = `$${currentBet}`;
    });
    
    betDownBtn.addEventListener('click', () => {
      if (spinning) return;
      currentBet = Math.max(MIN_BET, currentBet - BET_STEP);
      betDisplayEl.textContent = `$${currentBet}`;
    });

    spinBtn.addEventListener('click', () => {
      if (spinning) return;
      if (currentBet < MIN_BET || currentBet > MAX_BET) {
        showAlert(`Apuesta válida: $${MIN_BET} - $${MAX_BET}`);
        return;
      }
      if (balance < currentBet) {
        showAlert('Saldo insuficiente para esa apuesta');
        return;
      }

      balance -= currentBet;
      updateUI();

      spinning = true;
      spinBtn.disabled = true;

      const durations = [1600, 1800, 2000];
      const intervals = [null, null, null];
      const finalSymbols = [null, null, null];

      for (let i = 0; i < 3; i++) {
        intervals[i] = setInterval(() => {
          const s = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
          reelsEls[i].textContent = s;
          reelsEls[i].style.transform = 'translateY(0) scale(1.02)';
          setTimeout(()=> reelsEls[i].style.transform = 'translateY(0) scale(1)', 60);
        }, 80);

        ((index, stopAfter) => {
          setTimeout(() => {
            clearInterval(intervals[index]);
            const final = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
            finalSymbols[index] = final;
            reelsEls[index].textContent = final;
            reelsEls[index].style.transform = 'scale(1.08)';
            setTimeout(()=> reelsEls[index].style.transform = 'scale(1)', 160);

            if (index === 2) {
              setTimeout(() => finishSpin(finalSymbols), 120);
            }
          }, stopAfter);
        })(i, durations[i]);
      }
    });

    function finishSpin(finalSymbols){
      if (!Array.isArray(finalSymbols) || finalSymbols.length !== 3) {
        showAlert('Error interno: símbolos inválidos');
        resetAfterSpin();
        return;
      }

      const [a,b,c] = finalSymbols;
      let payout = 0;
      let message = '';
      let type = 'lose';

      if (a === b && b === c) {
        payout = currentBet * 10;
        message = `¡Jackpot! Ganaste $${payout}`;
        type = 'win';
      } else if (a === b || a === c || b === c) {
        payout = currentBet * 2;
        message = `¡Ganaste $${payout}! (2 símbolos)`;
        type = 'win';
      } else {
        payout = 0;
        message = `Perdiste $${currentBet}`;
        type = 'lose';
      }

      if (payout > 0) {
        balance += payout;
      }

      updateUI();
      showResult(message, type);

      if (balance < MIN_BET) {
        showAlert('Saldo bajo. Recarga para seguir jugando.');
      }

      resetAfterSpin();
    }

    function resetAfterSpin(){
      spinning = false;
      spinBtn.disabled = false;
    }
  </script>
</body>
</html>
